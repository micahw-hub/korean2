<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korean Lookup</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Korean">
<meta name="theme-color" content="#ffffff">
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mute:#86868b;--line:#e5e5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--line:#2c2c2e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:12vh 24px 80px}
h1{font-size:34px;font-weight:200;letter-spacing:-.02em;margin:0 0 40px;text-align:center}
form{display:flex;border-bottom:1px solid var(--line)}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:26px;padding:12px 0;outline:none}
input::placeholder{color:var(--mute)}
button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;cursor:pointer;padding:0 0 0 16px}
.sec{padding:24px 0;border-bottom:1px solid var(--line)}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.big{font-size:30px;font-weight:200}.mute{color:var(--mute)}
.say{padding:0;font-size:13px;color:var(--mute);margin-left:12px}
.hi{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.hh{display:flex;justify-content:space-between;align-items:baseline}.hh button{font-size:13px;color:var(--mute)}
.ai{display:block;margin-top:40px;text-align:center;font-size:15px;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:14px}
.ai span{display:block;font-size:13px;color:var(--mute);margin-top:4px}
#out{margin-top:8px}#hist{margin-top:40px}
</style>
</head>
<body>
<main>
<h1>Korean Lookup</h1>
<form id="f"><input id="q" placeholder="한국어" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ko"><button type="submit">Look up</button></form>
<div id="out"></div>
<div id="hist"></div>
<a class="ai" href="https://claude.ai/artifact/VgKyLVcDg29WHfC2UEqA5Z" target="_blank" rel="noopener">Open the AI version →<span>Meanings, examples, translation and questions. Needs a free Claude account.</span></a>
</main>
<script src="engine.js"></script>
<script>
const $=id=>document.getElementById(id),out=$("out"),hist=$("hist");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let items=[];try{items=JSON.parse(localStorage.getItem("kl_off")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("kl_off",JSON.stringify(items))}catch(e){}};
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.85;u.volume=1;const ks=speechSynthesis.getVoices().filter(v=>v.lang.replace("_","-").toLowerCase().startsWith("ko")&&!/injoon|\bmale\b/i.test(v.name));const v=ks.find(v=>/yuna|heami|sun-?hi|seoyeon|female|google/i.test(v.name))||ks[0];if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}
function show(w){
  const r=analyze(w);
  if(!/[가-힣]/.test(w)){out.innerHTML=`<div class="sec mute">Please type Korean (Hangul) characters.</div>`;return false}
  out.innerHTML=`<div class="sec"><div class="lbl">Word</div><div class="big">${esc(w)}<button class="say" id="ls">Listen</button></div></div>
  <div class="sec"><div class="lbl">Romanization</div><div class="big">${esc(r.rom)}</div></div>
  <div class="sec"><div class="lbl">Pronunciation</div><div class="big">${esc(r.pron)}</div>${r.rules.length?`<div class="mute" style="margin-top:8px;line-height:1.5">Sound changes: ${esc(r.rules.join(", "))}</div>`:""}<div class="mute" style="margin-top:12px;font-size:13px">Rule-based and approximate. Some words are exceptions.</div></div>`;
  $("ls").onclick=()=>speak(w);return true;
}
function renderHist(){
  if(!items.length){hist.innerHTML="";return}
  hist.innerHTML=`<div class="hh"><div class="lbl">History</div><button id="clr" type="button">Clear</button></div>`+items.map((h,i)=>`<button type="button" class="hi" data-i="${i}">${esc(h)}</button>`).join("");
  hist.querySelectorAll(".hi").forEach(b=>b.onclick=()=>{const w=items[b.dataset.i];$("q").value=w;show(w);scrollTo({top:0,behavior:"smooth"})});
  $("clr").onclick=()=>{items=[];save();renderHist()};
}
$("f").addEventListener("submit",e=>{e.preventDefault();const w=$("q").value.trim();if(!w)return;if(show(w)){items=[w,...items.filter(x=>x!==w)].slice(0,30);save();renderHist()}});
renderHist();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
